[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cdids"
version = "0.1.0"
description = "Cross-domain evaluation of deep-learning intrusion detection models on the NetFlow v2 datasets"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
